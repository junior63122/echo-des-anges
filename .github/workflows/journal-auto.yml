name: Journal - éditions

on:
  schedule:
    # Une veille par semaine : le lundi vers 6h/7h (heure de Paris), collecte des flux et rédaction des articles.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: journal
  cancel-in-progress: false

jobs:
  generer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Photos libres de droits (Wikimedia Commons)
        run: node scripts/fetch-images.mjs
      - name: Actualité (Business, Finance, Événementiel, Tech, Monde, Nice, Sport)
        run: node scripts/generate-news.mjs
      - name: Rédaction des articles du jour (sujets choisis parmi les dépêches)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/write-stories.mjs --nombre=10
      - name: Billet d'humeur satirique de la semaine
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/write-billet.mjs
      - name: Rédaction des revues par rubrique
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/write-articles.mjs
      - name: Référencement (pages statiques, sitemap, RSS, llms.txt)
        if: always()
        run: node scripts/build-static.mjs
      - name: Publier
        run: |
          git config user.name "journal-bot"
          git config user.email "journal-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Rien de nouveau" && exit 0
          git commit -m "Journal : édition du $(date -u +%F)"
          git pull --rebase
          git push
