name: Journal - photos des articles

on:
  workflow_dispatch:
  # Une passe courte après chaque édition et chaque dossier (les publications des robots ne
  # déclenchent pas « push »), plus une passe de rattrapage le lundi.
  workflow_run:
    workflows: ["Journal - éditions", "Journal - dossier de la semaine"]
    types: [completed]
  schedule:
    - cron: "17 9 * * 1"
  push:
    branches: [main]
    paths: [articles.json, scripts/fetch-article-images.mjs]

permissions:
  contents: write

concurrency:
  group: journal
  cancel-in-progress: false

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Photos libres de droits pour les articles (Wikimedia Commons)
        # Passe courte (10 min) : elle suit chaque édition, les minutes gratuites de GitHub suffisent.
        env:
          PHOTOS_MINUTES: "10"
        run: node scripts/fetch-article-images.mjs
      - name: Couvertures graphiques pour les articles sans photo juste
        run: |
          npm install --no-save --no-audit --no-fund sharp@0.33.5
          node scripts/couvertures.mjs
      - name: Redimensionner les nouvelles photos (1280 px)
        run: |
          nouvelles=$(git ls-files --others --exclude-standard img/entreprises | grep -i '\.jpe\?g$' || true)
          [ -z "$nouvelles" ] && exit 0
          command -v mogrify >/dev/null || (sudo apt-get update -q && sudo apt-get install -y -q imagemagick)
          for f in $nouvelles; do mogrify -resize '1280x>' -strip -quality 82 -interlace Plane "$f"; done
      - name: Publier
        # Le journal a pu changer pendant la passe : on repart de la dernière version et on y reporte
        # les photos trouvées (pas de fusion git, donc pas de conflit). Jusqu'à 5 essais.
        run: |
          git config user.name "journal-bot"
          git config user.email "journal-bot@users.noreply.github.com"
          T="$RUNNER_TEMP/photos"; mkdir -p "$T/img"
          cp articles.json "$T/articles.json"
          cp img/entreprises/*.jpg "$T/img/" 2>/dev/null || true
          cp img/couvertures/*.jpg "$T/img/" 2>/dev/null || true
          for essai in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            git clean -qfd img/entreprises img/couvertures
            mkdir -p img/couvertures
            node scripts/fusion-photos.mjs "$T/articles.json" "$T/img"
            node scripts/build-static.mjs
            git add -A
            git diff --cached --quiet && echo "Rien de nouveau" && exit 0
            git commit -qm "Journal : photos des articles"
            git push && exit 0
            sleep $((essai * 10))
          done
          exit 1
