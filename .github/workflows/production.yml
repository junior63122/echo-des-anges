name: Site - contrôle de la version en ligne

# À la demande uniquement, le site réellement en ligne sur echodesanges.fr est testé :
# HTTPS et redirection, en-têtes, puis parcours d'utilisation et ouverture de toutes les pages.
# Les minutes GitHub Actions servent uniquement aux robots du journal.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  en-ligne:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SITE: https://echodesanges.fr
    steps:
      # Version publiée (main) ; un lancement manuel peut viser une autre branche pour tester ses scripts.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Attendre la mise en ligne de GitHub Pages
        run: sleep 90
      - name: HTTPS, redirection et pages clés
        run: |
          set -e
          code() { curl -s -o /dev/null -w "%{http_code}" "$1"; }
          [ "$(curl -s -o /dev/null -w '%{redirect_url}' http://echodesanges.fr/)" = "https://echodesanges.fr/" ] || { echo "HTTP ne redirige pas vers HTTPS"; exit 1; }
          for u in / /en/ /economie/ /archives/ /recherche/ /contact/ /mentions-legales/ /sitemap.xml /robots.txt /feed.xml /articles-index.json; do
            c=$(code "$SITE$u"); echo "$c $u"; [ "$c" = "200" ] || exit 1
          done
          c=$(code "$SITE/page-qui-n-existe-pas/"); echo "$c page inexistante"; [ "$c" = "404" ] || exit 1
          curl -s "$SITE/" | grep -q 'rel="canonical" href="https://echodesanges.fr/"' || { echo "canonical de l'accueil incorrect"; exit 1; }
          curl -s "$SITE/" | grep -q 'Content-Security-Policy' || { echo "CSP absente"; exit 1; }
      - name: Mesure d'audience (GoatCounter)
        run: |
          curl -s -o /tmp/gc.txt -w "GoatCounter : %{http_code}\n" "https://echodesanges.goatcounter.com/count?p=%2Fcontrole&t=Controle&rnd=$RANDOM" -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36" -H "Referer: https://echodesanges.fr/" || true
          head -c 300 /tmp/gc.txt; echo
      - name: Outils
        run: |
          npm install --no-save --no-audit --no-fund esbuild@0.24.2 sharp@0.33.5 jsdom@24.1.3 playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Liste des pages (construite depuis la même version)
        run: |
          node scripts/build-static.mjs
          ESBUILD=node_modules/.bin/esbuild node scripts/preparer-site.mjs
      - name: Parcours d'utilisation sur le site en ligne
        run: node tests/scenarios.cjs "$SITE" | tee scenarios.txt && grep -q "^0 problème" scenarios.txt
      - name: Toutes les pages du site en ligne (mobile)
        run: node tests/pages.cjs "$SITE" _site | tee pages.txt && grep -q "^0 problème" pages.txt
