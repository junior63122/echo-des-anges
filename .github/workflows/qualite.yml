name: Site - contrôle qualité

# Avant toute fusion : le site est construit comme en production puis testé dans un vrai navigateur.
# Liens (toutes les pages), 840 pages ouvertes, scénarios d'utilisation, audit (9 tailles d'écran,
# accessibilité axe WCAG 2.2, clavier, réseau coupé ou lent, erreurs serveur, XSS, stabilité visuelle).
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Outils
        run: |
          npm install --no-save --no-audit --no-fund esbuild@0.24.2 sharp@0.33.5 jsdom@24.1.3 playwright@1.49.1 axe-core@4.10.2
          npx playwright install --with-deps chromium
      - name: Construire le site comme en production
        run: |
          node scripts/build-static.mjs
          ESBUILD=node_modules/.bin/esbuild node scripts/preparer-site.mjs
      - name: Liens de toutes les pages
        run: node tests/liens.cjs _site | tee liens.txt && grep -q " 0 cassés" liens.txt
      - name: Serveur local
        run: (node tests/serveur.cjs _site 8765 &) && sleep 2
      - name: Scénarios d'utilisation
        run: node tests/scenarios.cjs http://localhost:8765 | tee scenarios.txt && grep -q "^0 problème" scenarios.txt
      - name: Audit (tailles d'écran, accessibilité, clavier, réseau, sécurité)
        run: node tests/audit.cjs http://localhost:8765 | tee audit.txt && grep -q "^0 problème" audit.txt
      - name: Toutes les pages (mobile puis ordinateur)
        run: |
          node tests/pages.cjs http://localhost:8765 _site | tee pages.txt && grep -q "^0 problème" pages.txt
          LARGE=1 node tests/pages.cjs http://localhost:8765 _site | tee pages-ordi.txt && grep -q "^0 problème" pages-ordi.txt

  # Mêmes parcours dans Firefox et WebKit (le moteur de Safari) : scénarios et toutes les pages en mobile.
  navigateurs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        navigateur: [firefox, webkit]
    env:
      NAVIGATEUR: ${{ matrix.navigateur }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Outils
        run: |
          npm install --no-save --no-audit --no-fund esbuild@0.24.2 sharp@0.33.5 jsdom@24.1.3 playwright@1.49.1
          npx playwright install --with-deps ${{ matrix.navigateur }}
      - name: Construire le site comme en production
        run: |
          node scripts/build-static.mjs
          ESBUILD=node_modules/.bin/esbuild node scripts/preparer-site.mjs
      - name: Serveur local
        run: (node tests/serveur.cjs _site 8765 &) && sleep 2
      - name: Scénarios d'utilisation
        run: node tests/scenarios.cjs http://localhost:8765 | tee scenarios.txt && grep -q "^0 problème" scenarios.txt
      - name: Toutes les pages (mobile)
        run: node tests/pages.cjs http://localhost:8765 _site | tee pages.txt && grep -q "^0 problème" pages.txt
