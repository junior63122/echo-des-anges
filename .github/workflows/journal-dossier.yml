name: Journal - dossier de la semaine

# Revue de presse thématique rédigée automatiquement (sans API ni IA, donc gratuite).
# Le dossier quotidien est fait par l'édition du matin (« Journal - éditions ») pour économiser des
# minutes ; ce workflow sert au lancement manuel, par exemple pour une rubrique précise.
on:
  workflow_dispatch:
    inputs:
      theme:
        description: "Rubrique (vide = automatique) : Nice & Côte d'Azur, Business, Finance, Événementiel, Tech, Sport, Monde"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: journal
  cancel-in-progress: false

jobs:
  dossier:
    runs-on: ubuntu-latest
    outputs:
      publie: ${{ steps.publier.outputs.publie }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rédaction du dossier de la semaine
        env:
          THEME: ${{ inputs.theme }}
        run: |
          if [ -n "$THEME" ]; then node scripts/dossier-semaine.mjs --theme="$THEME"; else node scripts/dossier-semaine.mjs; fi
      - name: Référencement (pages statiques, sitemap, RSS, llms.txt)
        run: node scripts/build-static.mjs
      - name: Publier
        id: publier
        run: |
          git config user.name "journal-bot"
          git config user.email "journal-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Rien de nouveau" && exit 0
          git commit -m "Journal : dossier de la semaine du $(date -u +%F)"
          git pull --rebase
          git push
          echo "publie=oui" >> "$GITHUB_OUTPUT"

  site:
    needs: dossier
    if: ${{ needs.dossier.outputs.publie == 'oui' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-site.yml
