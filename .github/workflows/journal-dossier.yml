name: Journal - dossier de la semaine

# Revue de presse thématique rédigée automatiquement (sans API ni IA), publiée une fois
# par semaine : le lundi, après la veille hebdomadaire, un dossier pour chaque rubrique.
on:
  schedule:
    - cron: "41 6 * * 1" # le lundi vers 7h40/8h40 (heure de Paris), après la veille du matin
  workflow_dispatch:
    inputs:
      theme:
        description: "Rubrique (vide = automatique) : Nice & Côte d'Azur, Business, Finance, Événementiel, Tech, Sport, Monde"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: journal
  cancel-in-progress: false

jobs:
  dossier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rédaction du dossier de la semaine
        env:
          THEME: ${{ inputs.theme }}
        run: |
          if [ -n "$THEME" ]; then node scripts/dossier-semaine.mjs --theme="$THEME"; exit 0; fi
          # Toutes les rubriques le même jour (une seule veille par semaine).
          for t in "Nice & Côte d'Azur" Business Finance "Événementiel" Culture Sorties Tech Sport Monde; do
            node scripts/dossier-semaine.mjs --theme="$t" || echo "Rubrique $t : pas de dossier cette semaine"
          done
      - name: Agenda de la semaine
        if: ${{ github.event_name == 'schedule' }}
        run: node scripts/dossier-semaine.mjs --agenda
      - name: Référencement (pages statiques, sitemap, RSS, llms.txt)
        run: node scripts/build-static.mjs
      - name: Publier
        run: |
          git config user.name "journal-bot"
          git config user.email "journal-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Rien de nouveau" && exit 0
          git commit -m "Journal : dossier de la semaine du $(date -u +%F)"
          git pull --rebase
          git push
