name: Journal - dossier de la semaine

# Revue de presse thématique rédigée automatiquement (sans API ni IA, donc gratuite), publiée
# chaque jour : une rubrique différente à chaque fois, chacune revient une fois par semaine.
on:
  schedule:
    - cron: "41 5 * * *" # chaque jour vers 6h40/7h40 (heure de Paris), après la collecte du matin
  workflow_dispatch:
    inputs:
      theme:
        description: "Rubrique (vide = automatique) : Nice & Côte d'Azur, Business, Finance, Événementiel, Tech, Sport, Monde"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: journal
  cancel-in-progress: false

jobs:
  dossier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rédaction du dossier de la semaine
        env:
          THEME: ${{ inputs.theme }}
        run: |
          if [ -n "$THEME" ]; then node scripts/dossier-semaine.mjs --theme="$THEME"; else node scripts/dossier-semaine.mjs; fi
      - name: Agenda de la semaine (le lundi)
        if: ${{ github.event_name == 'schedule' }}
        run: |
          if [ "$(TZ=Europe/Paris date +%u)" = "1" ]; then node scripts/dossier-semaine.mjs --agenda; else echo "Pas lundi : pas d'agenda"; fi
      - name: Référencement (pages statiques, sitemap, RSS, llms.txt)
        run: node scripts/build-static.mjs
      - name: Publier
        run: |
          git config user.name "journal-bot"
          git config user.email "journal-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Rien de nouveau" && exit 0
          git commit -m "Journal : dossier de la semaine du $(date -u +%F)"
          git pull --rebase
          git push
